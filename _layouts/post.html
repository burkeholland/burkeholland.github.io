---
layout: default
---

<div class="post-wrap">
  <a href="/" class="post-back">&larr; All posts</a>
  <header>
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
  </header>
  {% if page.image %}
  <div class="post-banner">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title | strip_html }}">
  </div>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <div style="margin-top: var(--space-7); padding-top: var(--space-5); border-top: 1px solid var(--border);">
    <a href="/" class="post-back">&larr; All posts</a>
  </div>
</div>
