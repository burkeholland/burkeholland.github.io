---
layout: default
---

<section class="letter-hero">
  <div class="letter-layout">
    <p><a href="https://github.com/features/copilot" target="_blank" rel="noopener">
      <img src="https://img.shields.io/badge/-Built%20with%20Copilot-ffffff?style=flat&logo=githubcopilot&logoColor=333333" alt="Built with Copilot">
    </a></p>
    <h1 class="letter-headline">Hi, I'm <span class="gradient-text">Burke</span>.</h1>
    <p class="letter-tagline">I'm glad you're here.</p>
  </div>
</section>

<section class="latest-letter">
  <div class="letter-layout">
    <div class="latest-letter-heading">Latest notes</div>
    <div class="letter-posts">
      {% for post in paginator.posts %}
      <a class="letter-post" href="{{ post.url | relative_url }}">
        <span>
          <span class="letter-post-title">{{ post.title | strip_html }}</span>
          <span class="letter-post-excerpt">{{ post.content | markdownify | strip_html | truncatewords: 24 }}</span>
        </span>
        <span class="letter-post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
      </a>
      {% endfor %}
    </div>

    {% include pagination.html %}
  </div>
</section>
